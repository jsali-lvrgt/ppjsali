<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion – jsali_lvrgt</title>
  <link rel="icon" href="JSALI.png" />
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary-color: #c6c3c3;
      --second-color: #ffffff;
      --black-color: #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background-image: url("https://images.rawpixel.com/image_800/cHJpdmF0ZS9sci9pbWFnZXMvd2Vic2l0ZS8yMDIzLTA4L3Jhd3BpeGVsb2ZmaWNlMjBfM2RfbW9kZXJuX3dhdmVfY3VydmVfYWJzdHJhY3RfaGFsZnRvbmVfZ3JhZGllbl8xZTJhY2M3Mi1jZTU3LTQ0NjItOGQzNS1lOTI4YzI5NzcxMTdfMS5qcGc.jpg");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: rgba(0, 0, 0, 0.2);
    }

    .login_box {
      position: relative;
      width: 100%;
      max-width: 450px;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      background: transparent;
      border: 2px solid var(--primary-color);
      border-radius: 15px;
      padding: 7.5em 2.5em 3em 2.5em;
      color: var(--second-color);
      box-shadow: 0 0 10px 2px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .login-header {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--primary-color);
      width: 140px;
      height: 70px;
      border-radius: 0 0 20px 20px;
      z-index: 2;
    }

    .login-header span {
      font-size: 30px;
      color: var(--black-color);
    }

    .login-header::before {
      content: "";
      position: absolute;
      top: 0;
      left: -30px;
      width: 30px;
      height: 30px;
      border-top-right-radius: 50%;
      background: transparent;
      box-shadow: 15px 0 0 0 var(--primary-color);
    }

    .login-header::after {
      content: "";
      position: absolute;
      top: 0;
      right: -30px;
      width: 30px;
      height: 30px;
      border-top-left-radius: 50%;
      background: transparent;
      box-shadow: -15px 0 0 0 var(--primary-color);
    }

    /* Google Button */
    .google-button {
      padding: 10px;
      font-weight: bold;
      display: flex;
      position: relative;
      overflow: hidden;
      border-radius: 35px;
      align-items: center;
      border: 2px solid var(--black-color);
      outline: none;
      background: white;
      cursor: pointer;
      margin: 0 auto 25px;
      max-width: 280px;
    }

    .google-button .svg {
      height: 25px;
      margin-right: 10px;
    }

    .google-button .text {
      z-index: 10;
      font-size: 14px;
      color: var(--black-color);
    }

    .google-button:hover .text {
      animation: text forwards 0.3s;
    }

    @keyframes text {
      from { color: var(--black-color); }
      to { color: white; }
    }

    .google-button .svg {
      z-index: 6;
    }

    .google-button:hover::before {
      content: "";
      display: block;
      position: absolute;
      top: 50%;
      left: 9%;
      transform: translate(-50%, -50%);
      width: 0;
      height: 0;
      opacity: 0;
      border-radius: 300px;
      animation: wave1 2.5s ease-in-out forwards;
    }

    .google-button:hover::after {
      content: "";
      display: block;
      position: absolute;
      top: 50%;
      left: 9%;
      transform: translate(-50%, -50%);
      width: 0;
      height: 0;
      opacity: 0;
      border-radius: 300px;
      animation: wave2 2.5s ease-in-out forwards;
    }

    @keyframes wave1 {
      0% { z-index: 1; background: #EB4335; width: 0; height: 0; opacity: 1; }
      25% { z-index: 1; background: #EB4335; width: 800px; height: 800px; opacity: 1; }
      26% { z-index: 3; background: #34A853; width: 0; height: 0; opacity: 1; }
      50% { z-index: 3; background: #34A853; width: 800px; height: 800px; opacity: 1; }
      100% { z-index: 3; background: #34A853; width: 800px; height: 800px; opacity: 1; }
    }

    @keyframes wave2 {
      0% { z-index: 2; background: #FBBC05; width: 0; height: 0; opacity: 1; }
      35% { z-index: 2; background: #FBBC05; width: 800px; height: 800px; opacity: 1; }
      40% { z-index: 4; background: #4285F4; width: 0; height: 0; opacity: 1; }
      64% { z-index: 4; background: #4285F4; width: 800px; height: 800px; opacity: 1; }
      100% { z-index: 4; background: #4285F4; width: 800px; height: 800px; opacity: 1; }
    }

    .google-button:hover .red { animation: disappear 0.1s forwards; animation-delay: 0.1s; }
    .google-button:hover .yellow { animation: disappear 0.1s forwards; animation-delay: 0.3s; }
    .google-button:hover .green { animation: disappear 0.1s forwards; animation-delay: 0.7s; }
    .google-button:hover .blue { animation: disappear 0.1s forwards; animation-delay: 1.1s; }

    @keyframes disappear {
      from { filter: brightness(1); }
      to { filter: brightness(100); }
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: var(--second-color);
      font-size: 0.9rem;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid rgba(255,255,255,0.3);
    }

    .divider span {
      padding: 0 10px;
    }

    .input_box {
      position: relative;
      display: flex;
      flex-direction: column;
      margin: 20px 0;
      text-align: left;
    }

    .input-field {
      width: 100%;
      height: 55px;
      font-size: 16px;
      background: transparent;
      color: var(--second-color);
      padding-inline: 20px 50px;
      border: 2px solid var(--primary-color);
      border-radius: 30px;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--second-color);
    }

    .label {
      position: absolute;
      top: 15px;
      left: 20px;
      color: var(--second-color);
      font-size: 16px;
      pointer-events: none;
      transition: 0.2s;
    }

    .input-field:focus ~ .label,
    .input-field:not(:placeholder-shown) ~ .label {
      top: -10px;
      left: 20px;
      font-size: 14px;
      background: var(--primary-color);
      color: var(--black-color);
      padding: 0 8px;
      border-radius: 20px;
    }

    .icon {
      position: absolute;
      top: 18px;
      right: 25px;
      font-size: 20px;
      color: var(--second-color);
    }

    .remember-forgot {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      margin-top: -10px;
    }

    .remember-forgot label {
      color: var(--second-color);
      font-size: 14px;
    }

    .remember-forgot a {
      color: var(--second-color);
      text-decoration: none;
    }

    .remember-forgot a:hover {
      text-decoration: underline;
    }

    .input-submit {
      width: 100%;
      height: 50px;
      background: var(--second-color);
      color: var(--black-color);
      font-size: 16px;
      font-weight: 800;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .input-submit:hover {
      background: #e0e0e0;
    }

    .register {
      margin-top: 20px;
      font-size: 14px;
    }

    .register a {
      color: var(--second-color);
      text-decoration: none;
    }

    .register a:hover {
      text-decoration: underline;
    }

    .cf-turnstile {
      margin: 20px 0 10px;
      display: flex;
      justify-content: center;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(30, 30, 30, 0.9);
      color: white;
      padding: 1rem 1.4rem;
      border-radius: 0.8rem;
      font-size: 1rem;
      font-weight: 600;
      max-width: 90%;
      z-index: 1000;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border-left: 4px solid #4ade80;
      opacity: 0;
      transition: transform 0.4s, opacity 0.4s;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.error {
      border-left-color: #f87171;
    }

    @media (max-width: 564px) {
      .login_box {
        padding: 7.5em 1.5em 3em 1.5em;
      }
    }
  </style>
</head>
<body>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <div class="wrapper">
    <div class="login_box">
      <div class="login-header">
        <span>Login</span>
      </div>

      <!-- Google Sign-In -->
      <button class="google-button" id="googleSignIn">
        <svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid" viewBox="0 0 256 262" class="svg">
          <path fill="#4285F4" d="M255.878 133.451c0-10.734-.871-18.567-2.756-26.69H130.55v48.448h71.947c-1.45 12.04-9.283 30.172-26.69 42.356l-.244 1.622 38.755 30.023 2.685.268c24.659-22.774 38.875-56.282 38.875-96.027" class="blue"></path>
          <path fill="#34A853" d="M130.55 261.1c35.248 0 64.839-11.605 86.453-31.622l-41.196-31.913c-11.024 7.688-25.82 13.055-45.257 13.055-34.523 0-63.824-22.773-74.269-54.25l-1.531.13-40.298 31.187-.527 1.465C35.393 231.798 79.49 261.1 130.55 261.1" class="green"></path>
          <path fill="#FBBC05" d="M56.281 156.37c-2.756-8.123-4.351-16.827-4.351-25.82 0-8.994 1.595-17.697 4.206-25.82l-.073-1.73L15.26 71.312l-1.335.635C5.077 89.644 0 109.517 0 130.55s5.077 40.905 13.925 58.602l42.356-32.782" class="yellow"></path>
          <path fill="#EB4335" d="M130.55 50.479c24.514 0 41.05 10.589 50.479 19.438l36.844-35.974C195.245 12.91 165.798 0 130.55 0 79.49 0 35.393 29.301 13.925 71.947l42.211 32.783c10.59-31.477 39.891-54.251 74.414-54.251" class="red"></path>
        </svg>
        <span class="text">Continuer avec Google</span>
      </button>

      <div class="divider"><span>ou</span></div>

      <form id="loginForm">
        <div class="input_box">
          <input type="email" id="email" class="input-field" required placeholder=" ">
          <label for="email" class="label">E-mail</label>
          <i class="bx bx-envelope icon"></i>
        </div>

        <div class="input_box">
          <input type="password" id="password" class="input-field" required placeholder=" ">
          <label for="password" class="label">Mot de passe</label>
          <i class="bx bx-lock-alt icon"></i>
        </div>

        <div class="remember-forgot">
          <div class="remember-me">
            <input type="checkbox" id="remember" style="margin-right: 6px; accent-color: var(--primary-color);" />
            <label for="remember">Se souvenir de moi</label>
          </div>
        </div>

        <div class="cf-turnstile" data-sitekey="0x4AAAAAAB5t-g-mfliUjsH3"></div>

        <div class="input_box">
          <input type="submit" class="input-submit" value="Login" />
        </div>

        <div class="register">
          <span>Pas de compte ? <a href="register">Créer un compte</a></span>
        </div>
      </form>
    </div>
  </div>


  <div class="toast" id="toast"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://mqsebxyhynaroemoupwy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xc2VieHloeW5hcm9lbW91cHd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg5MDM0NzgsImV4cCI6MjA3NDQ3OTQ3OH0.ieD61m0CwOt7I2EA8Dstkd5Xd3RgOMQEFs5zpvB9hTU';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showToast(message, isError = false) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.className = `toast ${isError ? 'error' : ''} show`;
      setTimeout(() => toast.classList.remove('show'), 4000);
    }

    function resetTurnstile() {
      const container = document.querySelector('.cf-turnstile');
      if (container && typeof turnstile !== 'undefined') {
        turnstile.reset(container);
      }
    }

    // Google Sign-In
    document.getElementById('googleSignIn').addEventListener('click', async () => {
      try {
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: 'https://jsali-lvrgt.github.io/'// 👈 Update this
          }
        });
        if (error) throw error;
      } catch (err) {
        console.error('Google error:', err);
        showToast("Erreur Google.", true);
      }
    });

    // Login Form
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const turnstileToken = document.querySelector('input[name="cf-turnstile-response"]')?.value || '';

      if (!email || !password) return showToast("Tous les champs sont requis.", true);
      if (!turnstileToken) return showToast("Veuillez compléter le CAPTCHA.", true);

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;

        const username = data.user.user_metadata?.full_name || email.split('@')[0];
        localStorage.setItem('jsaliUser', username);
        showToast(`Bienvenue, ${username} !`);

        setTimeout(() => window.location.href = 'index.html', 1500);
      } catch (err) {
        resetTurnstile();
        let msg = "Identifiants incorrects.";
        if (err.message.includes('Email not confirmed')) msg = "Veuillez confirmer votre email.";
        showToast(msg, true);
      }
    });

    // Forgot Password Modal
    document.getElementById('forgotLink').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('forgotModal').style.display = 'flex';
    });

    document.getElementById('cancelResetBtn').addEventListener('click', () => {
      document.getElementById('forgotModal').style.display = 'none';
      document.getElementById('resetEmail').value = '';
    });

    document.getElementById('sendResetBtn').addEventListener('click', async () => {
      const email = document.getElementById('resetEmail').value.trim();
      if (!email) return showToast("Entrez une adresse email.", true);

      try {
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: 'https://yourdomain.com/reset-password.html' // 👈 Must match your reset page URL
        });
        if (error) throw error;

        showToast("Lien de réinitialisation envoyé !");
        document.getElementById('forgotModal').style.display = 'none';
        document.getElementById('resetEmail').value = '';
      } catch (err) {
        console.error(err);
        showToast("Impossible d’envoyer le lien.", true);
      }
    });
  </script>
</body>
